name: CI

# Full real builds, not eval-only -- see ADR-0008. `nix flake check` alone
# never touches `systemConfigs` (it's outside Nix's recognized flake schema),
# so that gets its own explicit build step below.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a branch/PR supersedes its still-running build; each run is
# a full closure build, so there's no value in finishing the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nix hygiene (issue #6), separate from build correctness below. Tools come
  # from this flake's own pinned nixpkgs (--inputs-from .), so a nixpkgs bump
  # is the only thing that can change formatter output. Fix locally with:
  #   nix shell --inputs-from . nixpkgs#nixfmt -c nixfmt $(git ls-files '*.nix')
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nixfmt / statix / deadnix
        run: |
          nix shell --inputs-from . nixpkgs#nixfmt nixpkgs#statix nixpkgs#deadnix -c bash -euo pipefail -c '
            nixfmt --check $(git ls-files "*.nix")
            statix check .
            deadnix --fail .
          '

  flake-check:
    name: flake-check
    # Native aarch64 (free for public repos), matching the CB1 target -- no
    # QEMU emulation. Under emulation on ubuntu-latest, compiling the
    # system-manager Rust CLI alone took ~52 min of a ~54 min run
    # (2026-09-09); see ADR-0008's 2026-09-23 update.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluates packages.aarch64-linux.* and the flake's general schema.
      # It does NOT build packages (only `checks.*` get built) -- they're
      # built below anyway, as part of systemConfigs.default's closure.
      - name: nix flake check
        run: nix flake check --all-systems

      # systemConfigs is a system-manager output, not part of Nix's flake
      # schema -- `nix flake check` silently skips it (confirmed live
      # 2026-08-11), so it needs this explicit build to actually verify the
      # machine spec. -L prints each derivation's build log, prefixed with
      # its name, so a slow build shows up in the (timestamped) job log.
      - name: Build systemConfigs.default
        run: nix build -L .#systemConfigs.default --print-out-paths
